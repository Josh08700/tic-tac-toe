[project]
name = "tic-tac-toe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xxx", email = "xxx" }
]
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.17.1",
]

[tool.uv]
package = false

[project.scripts]
tic-tac-toe = "tic_tac_toe:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
